<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>DayLog testsida</title>
<style>body{font:16px system-ui;max-width:640px;margin:40px auto}label{display:block;margin:14px 0 4px}input,textarea{width:100%;font:inherit;padding:6px}</style>
</head><body>
<h1>DayLog testsida</h1>
<p>Lokal sida för att testa maskering. Inget skickas någonstans.</p>
<label for="note">Anteckning (vanligt fält)</label>
<textarea id="note" rows="4"></textarea>
<label for="pw">Lösenord (type=password)</label>
<input id="pw" type="password" autocomplete="off">
<label for="otp">Engångskod (vanligt textfält med id otp)</label>
<input id="otp" type="text" autocomplete="off">
</body></html>
